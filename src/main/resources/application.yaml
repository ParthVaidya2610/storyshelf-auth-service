server:
  port: 8092

spring:
  application:
    name: auth-service

  datasource:
    # Neon (serverless Postgres). The URL must keep sslmode=require — Neon rejects
    # unencrypted connections. No default for the password: a missing value should
    # fail at boot rather than silently fall back to a local dev database.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # Tuned for Neon's scale-to-zero: the pool must be allowed to drain to nothing
    # (minimum-idle 0, keepalive off) or the compute never suspends. connection-timeout
    # is generous because resuming a suspended endpoint takes a few seconds.
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:300000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:0}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}

  jpa:
    hibernate:
      # Defaults to validate so Hibernate never mutates a shared schema on its own.
      # The first boot against an empty authdb needs update — see .env.example.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:key/private.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:key/public.pem}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P7D}

app:
  cookie:
    # true by default. Set COOKIE_SECURE=false only for local plain-HTTP work —
    # with it false the tokens travel in cleartext.
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Strict}
    domain: ${COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001}

auth:
  lockout:
    max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    # ISO-8601 duration. The lock clears itself once this elapses.
    duration: ${LOGIN_LOCKOUT_DURATION:PT15M}
  password-migration:
    # Off by default; re-encoding an already-hashed password is unrecoverable.
    enabled: ${PASSWORD_MIGRATION_ENABLED:false}
    dry-run: ${PASSWORD_MIGRATION_DRY_RUN:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info