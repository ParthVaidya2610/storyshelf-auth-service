server:
  port: 8089

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/bookshop_db
    username: postgres
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  private-key-path: classpath:key/private.pem
  public-key-path: classpath:key/public.pem
  expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info
